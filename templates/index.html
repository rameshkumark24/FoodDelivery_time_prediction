<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GourmetExpress | AI Predictor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ff4757;
            --secondary: #2f3542;
            --bg: #f1f2f6;
            --glass: rgba(255, 255, 255, 0.92);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(#ff475711 1px, transparent 0);
            background-size: 30px 30px;
            color: var(--secondary);
            min-height: 100vh;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }

        .header { text-align: center; margin-bottom: 40px; }
        .header h1 { font-size: 2.8em; color: var(--secondary); font-weight: 700; }
        .header span { color: var(--primary); }

        .main-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 30px; }

        .card {
            background: var(--glass); backdrop-filter: blur(10px); border-radius: 24px;
            padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.8);
        }

        h2 { margin-bottom: 20px; font-size: 1.4em; border-left: 4px solid var(--primary); padding-left: 15px; }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }

        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 0.85em; color: #57606f; }
        
        input, select {
            width: 100%; padding: 12px; border-radius: 10px; border: 2px solid #e0e6ed;
            background: white; transition: 0.2s; font-size: 0.95em;
        }
        input:focus, select:focus { border-color: var(--primary); outline: none; }

        button {
            width: 100%; padding: 16px; background: var(--primary); color: white; border: none;
            border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px; margin-top: 10px;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.2);
        }
        button:hover { background: #ff6b81; transform: translateY(-2px); }

        .result-section { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; min-height: 400px; }
        .prediction-box { display: none; width: 100%; }
        .prediction-box.active { display: block; animation: fadeIn 0.5s ease; }

        .time-display { 
            font-size: 5em; font-weight: 800; color: var(--primary); 
            line-height: 1; margin: 15px 0; 
            text-shadow: 2px 2px 0px rgba(0,0,0,0.05);
        }
        
        .loading { display: none; flex-direction: column; align-items: center; }
        .spinner {
            width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid var(--primary);
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Gourmet<span>Express</span></h1>
            <p>AI Delivery Time Predictor • Model: {{ model_info.best_model_name }}</p>
        </div>

        <div class="main-grid">
            <div class="card">
                <h2>Delivery Details</h2>
                <form id="deliveryForm">
                    <div class="row">
                        <div>
                            <label>Distance (km)</label>
                            <input type="number" id="distance" value="5.0" step="0.1" min="0.1" required>
                        </div>
                        <div>
                            <label>City Type</label>
                            <select id="city">
                                <option value="Urban" selected>Urban 🏙️</option>
                                <option value="Semi-Urban">Semi-Urban 🏡</option>
                                <option value="Metropolitan">Metropolitan 🌆</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div>
                            <label>Weather</label>
                            <select id="weather">
                                <option value="Sunny">Sunny ☀️</option>
                                <option value="Cloudy">Cloudy ☁️</option>
                                <option value="Rainy">Rainy 🌧️</option>
                                <option value="Fog">Fog 🌫️</option>
                                <option value="Stormy">Stormy ⛈️</option>
                            </select>
                        </div>
                        <div>
                            <label>Traffic</label>
                            <select id="traffic">
                                <option value="Low">Low 🟢</option>
                                <option value="Medium" selected>Medium 🟡</option>
                                <option value="High">High 🟠</option>
                                <option value="Jam">Jam 🔴</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div>
                            <label>Prep Time (min)</label>
                            <input type="number" id="prep_time" value="15" min="5" required>
                        </div>
                        <div>
                            <label>Order Type</label>
                            <select id="order_type">
                                <option value="Meal" selected>Meal 🍔</option>
                                <option value="Snack">Snack 🥨</option>
                                <option value="Drinks">Drinks 🥤</option>
                                <option value="Buffet">Buffet 🍱</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div>
                            <label>Vehicle</label>
                            <select id="vehicle">
                                <option value="motorcycle">Motorcycle 🏍️</option>
                                <option value="scooter">Scooter 🛵</option>
                                <option value="electric_scooter">Electric ⚡</option>
                                <option value="bicycle">Bicycle 🚲</option>
                            </select>
                        </div>
                        <div>
                            <label>Festival Day?</label>
                            <select id="festival">
                                <option value="No" selected>No</option>
                                <option value="Yes">Yes 🎉</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <div>
                            <label>Rider Age</label>
                            <input type="number" id="age" value="28" min="18" max="60">
                        </div>
                        <div>
                            <label>Rider Rating (1-5)</label>
                            <input type="number" id="rating" value="4.5" step="0.1" min="1" max="5">
                        </div>
                    </div>

                    <button type="submit">Predict Estimate</button>
                </form>
            </div>

            <div class="card result-section">
                <div id="placeholder">
                    <div style="font-size: 60px; opacity: 0.2; margin-bottom: 20px;">🛵</div>
                    <p style="opacity: 0.6;">Enter details to calculate</p>
                </div>

                <div class="loading" id="loader">
                    <div class="spinner"></div>
                    <p>Analyzing route & conditions...</p>
                </div>

                <div class="prediction-box" id="resultBox">
                    <h3 style="color: #777;">Estimated Arrival</h3>
                    <div class="time-display" id="timeResult">--</div>
                    <p style="font-size: 1.1em; color: var(--secondary);">minutes</p>
                    <div style="margin-top: 20px; padding: 15px; background: rgba(0,0,0,0.03); border-radius: 12px;">
                        <p id="rangeResult" style="font-weight: 600;">--</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('deliveryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI State
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('resultBox').classList.remove('active');
            document.getElementById('loader').style.display = 'flex';

            // Construct full payload including all keys
            const payload = {
                distance_km: parseFloat(document.getElementById('distance').value),
                city: document.getElementById('city').value,
                weather: document.getElementById('weather').value,
                traffic: document.getElementById('traffic').value,
                preparation_time: parseInt(document.getElementById('prep_time').value),
                order_type: document.getElementById('order_type').value,
                vehicle: document.getElementById('vehicle').value,
                festival: document.getElementById('festival').value,
                delivery_person_age: parseInt(document.getElementById('age').value),
                delivery_person_ratings: parseFloat(document.getElementById('rating').value),
                order_hour: new Date().getHours() // Auto-detect current hour
            };

            try {
                const res = await fetch('/predict', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                
                const data = await res.json();
                document.getElementById('loader').style.display = 'none';

                if(data.success) {
                    document.getElementById('timeResult').innerText = Math.round(data.predicted_time);
                    document.getElementById('rangeResult').innerText = 
                        `Range: ${Math.round(data.predicted_time_min)} - ${Math.round(data.predicted_time_max)} min`;
                    document.getElementById('resultBox').classList.add('active');
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                document.getElementById('loader').style.display = 'none';
                alert("Connection error. Please try again.");
            }
        });
    </script>
</body>
</html>
